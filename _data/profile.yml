short_bio: >-
  <p>
    I am a geospatial analytics researcher with a background in landscape architecture, environmental perception, and human-environment interaction.
    My work focuses on developing interpretable, human-centered environmental exposure metrics using spatial modelling, street-level imagery, and open-source GIS tools.
  </p>
  <p>
   I am particularly interested in how urban environments are represented, measured, and translated into evidence for planning, public health, and wellbeing.
    My recent projects examine blue-space soundscapes, social behavior, street-level environmental exposure, and parcel-level historical land-use continuity.
  </p>

