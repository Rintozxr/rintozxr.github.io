short_bio: >-
  <p>
    I am a researcher interested in how people perceive, experience, and navigate environments, and how these relationships can be represented through spatial data, street-level imagery, and interpretable AI.
  </p>
  <p>
   My work sits at the intersection of environmental behaviour, geospatial analytics, computer vision, and human-centered spatial intelligence. 
   Through both research and open-source tool development, I aim to build more meaningful representations of human-environment interactions for planning, health, and urban decision-making.
  </p>

