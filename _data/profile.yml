short_bio: >-
  <p>
    "Hi! I'm Xinran Zhang, a researcher with a background in Landscape Architecture and an MSc in Landscape and Wellbeing from the University of Edinburgh. My research explores how people perceive, experience, and interact with their environments. Starting from fieldwork and spatial analysis, I've gradually expanded into computer vision, human-centered AI, and embodied systems, with a particular interest in how computational models account for different people's needs and experiences. Outside research, I enjoy knitting, making things, and occasionally turning strange ideas into actual projects."
  </p>
